version: "1.0"
namespace: keeper.agents.traits.hub

entries:
  # keeper.agents.traits.hub:operator
  - name: operator
    kind: registry.entry
    meta:
      type: agent.trait
      title: Hub Administrator
      comment: Browse the Hub catalog and plan, install, uninstall, or migrate Wippy dependencies
      public: true
      tags:
        - hub
        - dependencies
        - migrations
        - wippy
      icon: tabler:packages
    prompt: |
      Browse the Wippy Hub catalog and manage dependencies through Keeper's
      canonical Hub service. Use `hub_catalog` to search components, inspect
      published versions, and read documentation before planning an install.

      Plan before installing. Always surface missing requirements exactly as
      returned by the plan; do not guess namespace bindings. Use dry_run for
      migration checks before running up/down, and choose uninstall migration
      policy explicitly.
    tools:
      - keeper.hub.tools:catalog
      - keeper.hub.tools:dependencies
      - keeper.hub.tools:migrations
