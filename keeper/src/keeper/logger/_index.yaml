version: "1.0"
namespace: keeper.logger

entries:
  # keeper.logger:client
  - name: client
    kind: library.lua
    meta:
      comment: Logger client library
      description: Client for querying and managing log buffer
    source: file://client.lua
    modules:
      - time
      - uuid
    imports:
      logger_consts: keeper.logger:consts
      logger_filter: keeper.logger:filter
    method: logger_client
    
  # keeper.logger:filter
  - name: filter
    kind: library.lua
    meta:
      comment: Log filter normalization and compilation
      description: Bare token is a message substring match; other text compiles as an expression with an explicit syntax error
    source: file://filter.lua
    modules:
      - expr
    method: filter

  # keeper.logger:filter_test
  - name: filter_test
    kind: function.lua
    meta:
      type: test
      comment: Log filter normalization and compilation tests
      suite: logger
    source: file://filter_test.lua
    imports:
      logger_filter: keeper.logger:filter
      test: wippy.test:test
    method: define_tests
    pool:
      size: 1

  # keeper.logger:consts
  - name: consts
    kind: library.lua
    meta:
      comment: Logger system constants
    source: file://consts.lua
    
  # keeper.logger:process
  - name: process
    kind: process.lua
    meta:
      comment: Logger service process
      description: Circular buffer logger for system log events
    source: file://process.lua
    modules:
      - logger
      - time
      - json
      - events
      - channel
    imports:
      logger_consts: keeper.logger:consts
      logger_filter: keeper.logger:filter
      notify: keeper.events:notify
      events_consts: keeper.events:consts
    method: run
    
  # keeper.logger:service
  - name: service
    kind: process.service
    meta:
      comment: Logger service
      description: Always-running service for capturing and buffering log events
    host: keeper.gov:processes
    lifecycle:
      depends_on:
        - keeper.gov:processes
      auto_start: true
      security:
        actor:
          id: logger.system
        groups:
          - keeper.gov.service.security:governance
    process: process
    