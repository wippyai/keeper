version: "1.0"
namespace: keeper.components.ui

entries:
  # keeper.components.ui:client
  - name: client
    kind: library.lua
    meta:
      comment: Client library for the UI supervisor (one-op-at-a-time UI automation)
    source: file://client.lua
    modules:
      - process
      - channel
      - time
      - uuid
      - json
    
  # keeper.components.ui:replay
  - name: replay
    kind: library.lua
    meta:
      comment: Runner container calls that replay the last open session on a container respawned after an idle kill
    source: file://replay.lua

  # keeper.components.ui:replay_test
  - name: replay_test
    kind: function.lua
    meta:
      type: test
      comment: replay — a respawned container replays the last open session, refreshing a minted token, before the requested op
      suite: components
    source: file://replay_test.lua
    imports:
      replay: keeper.components.ui:replay
      test: wippy.test:test
    method: define_tests

  # keeper.components.ui:supervisor
  - name: supervisor
    kind: process.lua
    meta:
      comment: Long-lived supervisor owning a single Playwright container
    source: file://supervisor.lua
    modules:
      - process
      - channel
      - exec
      - env
      - fs
      - http_client
      - json
      - system
      - time
      - uuid
      - logger
    imports:
      consts: keeper.components:consts
      filenames: keeper.components:filenames
      replay: keeper.components.ui:replay
      scanner: keeper.components.build:scanner
    method: run
    
  # keeper.components.ui:supervisor.service
  - name: supervisor.service
    kind: process.service
    meta:
      comment: Always-running UI supervisor (lazy-spawns Playwright container)
    host: keeper.gov:processes
    lifecycle:
      depends_on:
        - keeper.gov:processes
      auto_start: true
      security:
        actor:
          id: ui.supervisor
        groups:
          - keeper.gov.service.security:governance
    process: supervisor
    
