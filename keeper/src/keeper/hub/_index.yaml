version: "1.0"
namespace: keeper.hub

entries:
  # keeper.hub:ownership
  - name: ownership
    kind: library.lua
    meta:
      comment: Registry-owned ownership index resolving which module owns each resident entry
    source: file://ownership.lua
    modules:
      - registry

  # keeper.hub:planner
  - name: planner
    kind: library.lua
    meta:
      comment: Read-only Hub install planner for dependency graphs, transitive requirements, and explicit configuration state
    source: file://planner.lua
    modules:
      - registry
      - hub
      - json
    imports:
      gov_consts: keeper.gov:consts
      ownership: keeper.hub:ownership

  # keeper.hub:service
  - name: service
    kind: library.lua
    meta:
      comment: Hub dependency manager for runtime plugin install, uninstall, and explicit migration actions
    source: file://service.lua
    modules:
      - registry
      - funcs
      - sql
      - uuid
      - process
      - system
      - events
      - time
    imports:
      bootloader: wippy.bootloader:bootloader
      bootloader_registry: wippy.bootloader:bootloader_registry
      floor_catalog: keeper.hub:floor_catalog
      preflight: keeper.hub:preflight
      install_state: keeper.hub:install_state
      install_quiescence: keeper.hub:install_quiescence
      install_candidate: keeper.hub:install_candidate
      install_runner: keeper.hub:install_runner
      install_digest: keeper.hub:install_digest
      keeper_config: keeper:config
      gov_consts: keeper.gov:consts
      governance: keeper.state.publish:governance
      materialize: keeper.state.persist:materialize
      planner: keeper.hub:planner
      ownership: keeper.hub:ownership
      sql_dialect: keeper.internal:sql_dialect
      step_runner: keeper.develop.integrate.pipeline:step_runner

  # keeper.hub:security_scan
  - name: floor_catalog
    kind: library.lua
    source: file://migration/floor_catalog.lua

  - name: preflight
    kind: library.lua
    source: file://migration/preflight.lua
    imports:
      floor_catalog: keeper.hub:floor_catalog

  - name: install_state
    kind: library.lua
    source: file://migration/install_state.lua
    modules:
      - json
      - sql
    imports:
      sql_dialect: keeper.internal:sql_dialect

  - name: preflight_test
    kind: function.lua
    meta:
      type: test
      suite: hub
    source: file://migration/preflight_test.lua
    modules:
      - sql
      - json
    imports:
      test: wippy.test:test
      floor_catalog: keeper.hub:floor_catalog
      preflight: keeper.hub:preflight
      install_state: keeper.hub:install_state
      hub_service: keeper.hub:service
    method: define_tests

  - name: install_quiescence
    kind: library.lua
    source: file://install/quiescence.lua

  - name: install_candidate
    kind: library.lua
    source: file://install/candidate.lua
    modules:
      - hash

  - name: install_runner
    kind: library.lua
    source: file://install/runner.lua
    modules:
      - hash
    imports:
      install_digest: keeper.hub:install_digest

  - name: install_digest
    kind: library.lua
    source: file://install/digest.lua
    modules:
      - hash

  - name: install_test
    kind: function.lua
    meta:
      type: test
      suite: hub
    source: file://install/install_test.lua
    modules:
      - sql
    imports:
      test: wippy.test:test
      hub_service: keeper.hub:service
      preflight: keeper.hub:preflight
      install_candidate: keeper.hub:install_candidate
    method: define_tests

  - name: preflight_bootloader
    kind: function.lua
    meta:
      type: bootloader
      order: 0
      description: Refuse incompatible installed artifacts before boot migrations
    source: file://install/boot.lua
    imports:
      hub_service: keeper.hub:service
    method: run

  - name: security_scan
    kind: library.lua
    meta:
      comment: Read-only Hub module security reviewer for install planning
    source: file://security_scan.lua
    modules:
      - hub
      - json
      - registry
      - time
    imports:
      keeper_config: keeper:config
      llm: wippy.llm:llm
      planner: keeper.hub:planner
      prompt: wippy.llm:prompt
    
  # keeper.hub:test
  - name: test
    kind: function.lua
    meta:
      type: test
      comment: Hub service unit tests for dependency patches, migration policy, and dry-run behavior
      suite: hub
    source: file://test.lua
    modules:
      - http_client
      - json
      - sql
    imports:
      api_test: keeper.tests:api_test
      api_http: keeper.hub.api:http
      gov_consts: keeper.gov:consts
      hub_dependencies_tool: keeper.hub.tools:dependencies
      hub_migrations_tool: keeper.hub.tools:migrations
      hub_service: keeper.hub:service
      planner: keeper.hub:planner
      ownership: keeper.hub:ownership
      security_scan: keeper.hub:security_scan
      test: wippy.test:test
    method: define_tests
    pool:
      size: 1
