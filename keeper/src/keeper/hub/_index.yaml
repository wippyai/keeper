version: "1.0"
namespace: keeper.hub

entries:
  # keeper.hub:provenance
  - name: provenance
    kind: library.lua
    meta:
      comment: Registry-owned provenance index resolving which module owns each resident entry
    source: file://provenance.lua
    modules:
      - registry

  # keeper.hub:planner
  - name: planner
    kind: library.lua
    meta:
      comment: Read-only Hub install planner for dependency graphs, transitive requirements, and explicit configuration state
    source: file://planner.lua
    modules:
      - registry
      - hub
    imports:
      gov_consts: keeper.gov:consts
      provenance: keeper.hub:provenance

  # keeper.hub:service
  - name: service
    kind: library.lua
    meta:
      comment: Hub dependency manager for runtime plugin install, uninstall, and explicit migration actions
    source: file://service.lua
    modules:
      - registry
      - funcs
      - sql
      - uuid
      - process
      - system
    imports:
      gov_consts: keeper.gov:consts
      governance: keeper.state.publish:governance
      materialize: keeper.state.persist:materialize
      planner: keeper.hub:planner
      provenance: keeper.hub:provenance
      sql_dialect: keeper.internal:sql_dialect
      step_runner: keeper.develop.integrate.pipeline:step_runner

  # keeper.hub:security_scan
  - name: security_scan
    kind: library.lua
    meta:
      comment: Read-only Hub module security reviewer for install planning
    source: file://security_scan.lua
    modules:
      - hub
      - json
      - registry
      - time
    imports:
      keeper_config: keeper:config
      llm: wippy.llm:llm
      planner: keeper.hub:planner
      prompt: wippy.llm:prompt
    
  # keeper.hub:test
  - name: test
    kind: function.lua
    meta:
      type: test
      comment: Hub service unit tests for dependency patches, migration policy, and dry-run behavior
      suite: hub
    source: file://test.lua
    modules:
      - http_client
      - json
      - sql
    imports:
      api_test: keeper.tests:api_test
      api_http: keeper.hub.api:http
      gov_consts: keeper.gov:consts
      hub_dependencies_tool: keeper.hub.tools:dependencies
      hub_migrations_tool: keeper.hub.tools:migrations
      hub_service: keeper.hub:service
      planner: keeper.hub:planner
      provenance: keeper.hub:provenance
      security_scan: keeper.hub:security_scan
      test: wippy.test:test
    method: define_tests
    pool:
      size: 1
