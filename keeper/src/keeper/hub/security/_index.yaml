version: "1.0"
namespace: keeper.hub.security

entries:
  - name: admin_discovery
    kind: security.policy
    meta:
      comment: Allow Keeper administrators to discover the Hub Administrator trait and its exact tool surface.
    groups: []
    policy:
      resources:
        - keeper.agents.traits.hub:operator
        - keeper.hub.tools:catalog
        - keeper.hub.tools:dependencies
        - keeper.hub.tools:migrations
      actions:
        - registry.get
        - registry.find
      effect: allow

  - name: admin_call
    kind: security.policy
    meta:
      comment: Allow Keeper administrators to invoke only the Hub Administrator tool functions.
    groups: []
    policy:
      resources:
        - keeper.hub.tools:catalog
        - keeper.hub.tools:dependencies
        - keeper.hub.tools:migrations
      actions:
        - funcs.call
        - access
      effect: allow

  - name: admin_install_process
    kind: security.policy
    meta:
      comment: Allow Keeper administrators to start the Hub install worker, and the worker to hold the install lock under the identity it inherits.
    groups: []
    policy:
      resources:
        - keeper.hub.api:install_worker
        - keeper.hub.install
      actions:
        - process.spawn
        - process.spawn.monitored
        - process.registry.register
      effect: allow

  - name: admin_install_host
    kind: security.policy
    meta:
      comment: Allow Keeper administrators to place the Hub install worker on Keeper's process host. The resource is bound from the keeper:process_host requirement.
    groups: []
    policy:
      resources: app:processes
      actions:
        - process.host
      effect: allow

  - name: admin_catalog
    kind: security.policy
    meta:
      comment: Allow Hub administrator tools to read the Hub catalog, the configured registry, and registry resolution for ownership and planning.
    groups: []
    policy:
      resources: '*'
      actions:
        - hub.modules.list
        - hub.modules.search
        - hub.modules.readme
        - hub.versions.list
        - registry.resolution.get
        - hub.auth.status
      effect: allow
