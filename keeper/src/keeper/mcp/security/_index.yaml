version: "1.0"
namespace: keeper.mcp.security

entries:
  # keeper.mcp.security:session_runtime
  - name: session_runtime
    kind: security.policy
    meta:
      comment: Runtime permissions used by scoped MCP sessions after Keeper has filtered the MCP tool surface.
    groups:
      - keeper.mcp.security:session
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # keeper.mcp.security:session_forbid_call_tool
  - name: session_forbid_call_tool
    kind: security.policy
    meta:
      comment: Scoped MCP sessions may call only surfaced MCP tools; arbitrary registry-tool dispatch is root-only.
    groups:
      - keeper.mcp.security:session
    policy:
      resources: '*'
      actions: keeper.mcp.call_tool
      effect: deny

  # keeper.mcp.security:root_runtime
  - name: root_runtime
    kind: security.policy
    meta:
      comment: Full runtime permissions for mcp.root sessions bound to an active Keeper admin actor.
    groups:
      - keeper.mcp.security:root
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  # keeper.mcp.security:endpoint_db_access
  - name: endpoint_db_access
    kind: security.policy
    meta:
      comment: The public Keeper MCP endpoint may open the app database to resolve a bearer token and persist session state.
    policy:
      resources: app:db
      actions:
        - db.get
      effect: allow

  # keeper.mcp.security:endpoint_actor_create
  - name: endpoint_actor_create
    kind: security.policy
    meta:
      comment: The public Keeper MCP endpoint may synthesize the resolved token subject actor and runtime scope. Scope resolution goes through security.named_scope, which the runtime gates behind security.policy_group.get, so tool dispatch needs that action too.
    policy:
      resources: '*'
      actions:
        - security.actor.create
        - security.scope.create
        - security.policy_group.get
        - funcs.security
        - funcs.context
        - funcs.call
      effect: allow

  # keeper.mcp.security:endpoint_registry_read
  - name: endpoint_registry_read
    kind: security.policy
    meta:
      comment: The public Keeper MCP endpoint may read registry entries to build the surfaced tool and trait catalog.
    policy:
      resources: '*'
      actions:
        - registry.find
        - registry.get
      effect: allow

  # keeper.mcp.security:endpoint_env_read
  - name: endpoint_env_read
    kind: security.policy
    meta:
      comment: The public Keeper MCP endpoint may read its transport switch and the public base URL it advertises.
    policy:
      resources:
        - keeper.mcp:enabled
        - PUBLIC_API_URL
      actions:
        - env.get
      effect: allow
