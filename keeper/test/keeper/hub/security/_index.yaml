version: "1.0"
namespace: keeper.hub.security

entries:
  - name: security_test_entry
    kind: security.policy
    meta:
      comment: Test-host entry point for ordinary-user capability discovery probes.
    groups:
      - app.security:user
    policy:
      resources:
        - keeper.hub.security:security_probe
      actions:
        - funcs.call
      effect: allow

  - name: security_test_permissive
    kind: security.policy
    meta:
      comment: Test-host registry and function plumbing for defense-in-depth checks.
    groups:
      - keeper.hub.security:test_permissive
    policy:
      resources:
        - keeper:*
        - keeper.*
      actions:
        - registry.get
        - funcs.call
      effect: allow

  - name: security_test_permissive_context
    kind: security.policy
    meta:
      comment: Test-host function context plumbing that the agent tool caller needs, so the probe reaches the Hub tool access check.
    groups:
      - keeper.hub.security:test_permissive
    policy:
      resources:
        - context
      actions:
        - funcs.context
      effect: allow

  - name: security_test
    kind: function.lua
    meta:
      type: test
      comment: Exact Hub Administrator discovery, invocation, native catalog, and inherited agent security tests.
      suite: hub_security
    source: file://security_test.lua
    modules:
      - security
      - registry
      - funcs
    imports:
      catalog: keeper.hub.tools:catalog
      dependencies: keeper.hub.tools:dependencies
      migrations: keeper.hub.tools:migrations
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: define_tests
    pool:
      size: 1

  - name: security_probe
    kind: function.lua
    meta:
      comment: Probe that the Hub security cases call under a chosen actor and scope.
    source: file://security_test.lua
    modules:
      - security
      - registry
      - funcs
    imports:
      catalog: keeper.hub.tools:catalog
      dependencies: keeper.hub.tools:dependencies
      migrations: keeper.hub.tools:migrations
      test: wippy.test:test
      tool_caller: wippy.agent.tools:caller
    method: probe
    pool:
      size: 1

  - name: resolution_test
    kind: function.lua
    meta:
      type: test
      comment: Hub ownership and planner resolution read permission regression.
      suite: hub_security
    source: file://resolution_test.lua
    modules:
      - security
    imports:
      test: wippy.test:test
    method: define_tests
    pool:
      size: 1
